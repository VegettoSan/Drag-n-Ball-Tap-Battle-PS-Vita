name: Community mod profiles

on:
  push:
    branches: [main]
    paths:
      - 'src/community_profiles.hpp'
      - 'src/pac.cpp'
      - 'src/pac.hpp'
      - 'src/image.cpp'
      - 'src/image.hpp'
      - 'src/game_data.cpp'
      - 'src/game_data.hpp'
      - 'src/engine_resources.cpp'
      - 'src/engine_resources.hpp'
      - 'src/installed_data.cpp'
      - 'src/installed_data.hpp'
      - 'tools/community14.py'
      - 'tools/extract_apk_data.py'
      - 'tools/prepare_samu_mod.py'
      - 'tests/test_community.cpp'
      - 'tests/test_game_data.cpp'
      - 'tests/test_engine_resources.cpp'
      - 'tests/test_installed_data.cpp'
      - 'tests/test_extractor.py'
      - 'tests/test_prepare_samu_mod.py'
      - '.github/workflows/community-mod-profiles.yml'
  workflow_dispatch:

jobs:
  synthetic-profile-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host decoder dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libpng-dev zlib1g-dev

      - name: Validate extractor aliases and protected profile detection
        run: python3 -m unittest discover -s tests -p test_extractor.py -v

      - name: Validate Samu profile preparation rules
        run: python3 -m unittest discover -s tests -p test_prepare_samu_mod.py -v

      - name: Validate PAC and image codecs for every audited profile
        run: |
          set -euo pipefail
          g++ -std=c++14 -O2 -Wall -Wextra -Isrc             tests/test_community.cpp src/pac.cpp src/image.cpp             -lpng -lz -o /tmp/dbtb-community-profiles
          /tmp/dbtb-community-profiles

      - name: Validate converted GameData tables for every audited profile
        run: |
          set -euo pipefail
          g++ -std=c++14 -O2 -Wall -Wextra -Isrc             tests/test_game_data.cpp src/game_data.cpp src/pac.cpp src/vfs.cpp             -o /tmp/dbtb-game-data-profiles
          /tmp/dbtb-game-data-profiles

      - name: Validate full engine resource normalisation for every protected profile
        run: |
          set -euo pipefail
          g++ -std=c++14 -O2 -Wall -Wextra -Isrc \
            tests/test_engine_resources.cpp src/engine_resources.cpp src/game_data.cpp \
            src/pac.cpp src/vfs.cpp src/image.cpp -lpng -lz \
            -o /tmp/dbtb-engine-resource-profiles
          /tmp/dbtb-engine-resource-profiles

      - name: Validate extended offline character installation gate
        run: |
          set -euo pipefail
          g++ -std=c++14 -O2 -Wall -Wextra -Isrc \
            tests/test_installed_data.cpp src/installed_data.cpp src/pac.cpp src/vfs.cpp \
            -o /tmp/dbtb-installed-data
          /tmp/dbtb-installed-data
