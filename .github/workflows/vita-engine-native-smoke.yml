name: Vita engine native smoke

on:
  push:
    branches: [main]
    paths:
      - 'assets/livearea/**'
      - 'cmake/LiveArea.cmake'
      - 'tools/decode_livearea_assets.py'
      - 'tools/validate_livearea_vpk.py'
      - 'tools/normalize_livearea_palette.py'
      - 'tools/repack_livearea_vpk.py'
      - 'tests/test_livearea.py'
      - 'tests/test_shared_save_seed.py'
      - 'tests/test_offline_startup_contract.py'
      - 'tools/aot/engine/java/com/namcobandaigames/dragonballtap/apk/Downloader.java'
      - 'assets/default_save.bin.zlib.b64'
      - 'tools/materialize_default_save.py'
      - 'tools/aot/engine/native/**'
      - 'tools/aot/engine/vita/**'
      - 'tools/aot/vita/utf16.c'
      - 'tools/aot/vita/uchar.h'
      - 'src/**'
      - '.github/workflows/vita-engine-native-smoke.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4

      - name: Validate approved LiveArea source payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/decode_livearea_assets.py tools/validate_livearea_vpk.py
          python3 -m unittest discover -s tests -p test_livearea.py -v
          python3 -m unittest discover -s tests -p test_shared_save_seed.py -v
          python3 -m unittest discover -s tests -p test_offline_startup_contract.py -v
          rm -rf /tmp/dbtb-livearea-check
          python3 tools/decode_livearea_assets.py \
            --source assets/livearea \
            --output /tmp/dbtb-livearea-check
          test -s /tmp/dbtb-livearea-check/icon0.png
          test -s /tmp/dbtb-livearea-check/bg0.png
          test -s /tmp/dbtb-livearea-check/startup.png
          test -s /tmp/dbtb-livearea-check/pic0.png

      - name: Pack current Vita source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -cf dbtb-vita-source-current.tar \
            src \
            tools/aot/engine \
            tools/aot/vita \
            tools/decode_livearea_assets.py \
            tools/validate_livearea_vpk.py \
            tools/normalize_livearea_palette.py \
            tools/repack_livearea_vpk.py \
            assets/livearea \
            cmake \
            docs/THIRD_PARTY.md \
            licenses

      - name: Upload current Vita source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dbtb-vita-source-current
          if-no-files-found: error
          path: dbtb-vita-source-current.tar

      - name: Create non-commercial TeaVM link probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dbtb-teavm-smoke
          cat >/tmp/dbtb-teavm-smoke/all.c <<'EOF'
          #include <stdio.h>
          int main(void) {
              puts("DB Tap Battle Vita native engine smoke");
              return 0;
          }
          EOF

      - name: Configure full native engine target
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/aot/engine/vita -B build-engine-smoke \
            -DCMAKE_BUILD_TYPE=Release \
            -DTEAVM_C_DIR=/tmp/dbtb-teavm-smoke

      - name: Build and validate ELF SELF VPK LiveArea
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-engine-smoke -j2
          test -s build-engine-smoke/dbtb_original_engine
          test -s build-engine-smoke/eboot.bin
          VPK="$(find build-engine-smoke -maxdepth 1 -type f -name 'DBTapBattle-Vita-*.vpk' -print -quit)"
          test -n "$VPK"
          test -s "$VPK"
          file build-engine-smoke/dbtb_original_engine
          python3 tools/validate_livearea_vpk.py "$VPK"
          sha256sum "$VPK"

      - name: Upload smoke build
        uses: actions/upload-artifact@v4
        with:
          name: dbtb-native-link-probe-NOT-PLAYABLE
          if-no-files-found: error
          path: |
            build-engine-smoke/dbtb_original_engine
            build-engine-smoke/eboot.bin
            build-engine-smoke/DBTapBattle-Vita-*.vpk
