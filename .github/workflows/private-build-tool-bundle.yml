name: Private build tool bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-build-tool-bundle.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Collect pinned public tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tool-bundle/lib tool-bundle/dex2jar
          curl -fL --retry 4 \
            https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip \
            -o tool-bundle/dex-tools-v2.4.zip
          unzip -q tool-bundle/dex-tools-v2.4.zip -d tool-bundle/dex2jar
          mvn -q -f tools/aot/pom.xml dependency:copy-dependencies \
            -DoutputDirectory="$GITHUB_WORKSPACE/tool-bundle/lib" \
            -DincludeScope=runtime
          curl -fL --retry 4 \
            https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/3.37.0/ecj-3.37.0.jar \
            -o tool-bundle/ecj-3.37.0.jar
          sha256sum tool-bundle/dex-tools-v2.4.zip tool-bundle/ecj-3.37.0.jar \
            tool-bundle/lib/*.jar > tool-bundle/SHA256SUMS.txt
          test -s tool-bundle/lib/teavm-cli-0.12.3.jar
          test -s tool-bundle/lib/teavm-classlib-0.12.3.jar
          test -s tool-bundle/lib/teavm-interop-0.12.3.jar
          test -s tool-bundle/lib/asm-9.7.1.jar

      - name: Upload tool bundle
        uses: actions/upload-artifact@v4
        with:
          name: dbtb-private-build-tools
          if-no-files-found: error
          retention-days: 1
          path: tool-bundle
