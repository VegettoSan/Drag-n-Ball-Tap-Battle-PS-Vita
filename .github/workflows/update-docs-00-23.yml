name: Synchronize 00.23 documentation

on:
  push:
    branches: [main]
    paths:
      - 'tools/update_docs_00_23.py'
      - '.github/workflows/update-docs-00-23.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct one-shot checkpoint literal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/update_docs_00_23.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('{VERSION[:-1]}22', '00.22')
          s = s.replace('""".replace("0022", "00.22")', '"""')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Update every Markdown document
        run: python3 tools/update_docs_00_23.py

      - name: Verify every Markdown has current checkpoint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(Path('.').rglob('*.md'))
          missing = [str(p) for p in files if 'DBTB_CURRENT_CHECKPOINT:START' not in p.read_text(encoding='utf-8')]
          print(f'checked {len(files)} Markdown files')
          if missing:
              print('missing checkpoint:', *missing, sep='\n')
              raise SystemExit(1)
          assert Path('docs/TEST_VITA_00_23.md').is_file()
          assert Path('docs/evidence/vita_hardware_full_game_00.23.json').is_file()
          PY

      - name: Commit synchronized documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data docs tools/aot tools/update_docs_00_23.py
          if git diff --cached --quiet; then
            echo 'No documentation changes to commit.'
            exit 0
          fi
          git commit -m 'Document hardware-validated 00.23 across all Markdown'
          git push origin HEAD:main
