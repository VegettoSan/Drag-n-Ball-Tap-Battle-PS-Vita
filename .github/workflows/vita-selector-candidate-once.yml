name: Build 00.34 selector candidate once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vita-selector-candidate-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  candidate:
    uses: ./.github/workflows/vita-publish.yml
    with:
      prerelease: true
      notes: '00.34 test candidate: Gen/select0.pac-styled first-screen data selector; 00.33 gameplay baseline preserved.'
    secrets:
      original_apk_url: ${{ secrets.DBTB_ORIGINAL_APK_URL }}
